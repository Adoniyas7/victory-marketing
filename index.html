<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Victory Marketing Agency | Scale Sales & Grow Online</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Victory Marketing is Ethiopia's fastest growing marketing agency. We help businesses scale sales and grow online through strategic content creation, social media management, paid advertising, and digital marketing solutions." />
    <meta name="keywords" content="marketing agency Ethiopia, digital marketing Addis Ababa, social media management, content creation, paid advertising, SEO, web development, branding" />
    <meta name="author" content="Victory Marketing Agency" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Victory Marketing Agency | Scale Sales & Grow Online" />
    <meta property="og:description" content="Ethiopia's fastest growing marketing agency. We help businesses attract customers, strengthen their online presence, and achieve measurable growth." />
    <meta property="og:image" content="assets/images/logo.png" />
    <meta property="og:site_name" content="Victory Marketing" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Victory Marketing Agency | Scale Sales & Grow Online" />
    <meta name="twitter:description" content="Ethiopia's fastest growing marketing agency. Strategic content creation, social media management, and digital marketing solutions." />
    <meta name="twitter:image" content="assets/images/logo.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/logo.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/navigation.css" />
    <link rel="stylesheet" href="css/hero.css" />
    <link rel="stylesheet" href="css/sections.css" />
    <link rel="stylesheet" href="css/team.css" />
    <link rel="stylesheet" href="css/testimonials.css" />
    <link rel="stylesheet" href="css/contact.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/clients.css" />
    <link rel="stylesheet" href="css/portfolio.css" />
    <link rel="stylesheet" href="css/whatsapp.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <script>
      (function () {
        const stored = localStorage.getItem('theme');
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        if (stored === 'light' || (!stored && prefersLight)) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
        document.documentElement.classList.add('js');
      })();
    </script>
  </head>
  <body>

    <a href="#home" class="skip-link">Skip to main content</a>

    <!-- Navigation -->
    <nav id="navbar" aria-label="Main navigation">
      <a href="#" class="nav-logo">
        <img src="assets/images/logo.png" alt="Victory Marketing Logo" />
        <span>Victory <span>Marketing</span></span>
      </a>
      <ul class="nav-links" id="navLinks" aria-label="Navigation links">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#portfolio">Our Work</a></li>
        <li><a href="#team">Team</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a href="#contact" class="nav-cta">Get Started</a></li>
      </ul>
      <button
        class="mobile-menu-btn"
        id="mobileMenuBtn"
        aria-label="Toggle menu"
        aria-expanded="false"
        aria-controls="navLinks"
      >
        <i class="fas fa-bars" aria-hidden="true"></i>
      </button>
      <button class="theme-toggle" id="themeToggle" aria-label="Switch to light mode">
        <i class="fas fa-moon" aria-hidden="true"></i>
      </button>
    </nav>

    <!-- Hero Section -->
    <section class="hero" id="home" data-section="hero"></section>

    <!-- Client Logos -->
    <section class="clients" data-section="clients"></section>

    <!-- About Section -->
    <section class="about" id="about" data-section="about"></section>

    <!-- Mission, Vision & Objective -->
    <section class="mission-section" id="mission" data-section="mission"></section>

    <!-- Services Section -->
    <section class="services" id="services" data-section="services"></section>

    <!-- Portfolio / Case Studies -->
    <section class="portfolio" id="portfolio" data-section="portfolio"></section>

    <!-- Why Choose Us -->
    <section class="why-us" id="why-us" data-section="why-us"></section>

    <!-- Process Section -->
    <section class="process" id="process" data-section="process"></section>

    <!-- Testimonials -->
    <section class="testimonials" id="testimonials" data-section="testimonials"></section>

    <!-- Team Section -->
    <section class="team" id="team" data-section="team"></section>

    <!-- CTA Banner -->
    <section data-section="cta"></section>

    <!-- Contact Section -->
    <section class="contact" id="contact" data-section="contact"></section>

    <!-- Footer -->
    <footer data-section="footer"></footer>

    <!-- Scroll to Top -->
    <button class="scroll-top" id="scrollTop" aria-label="Scroll to top">
      <i class="fas fa-arrow-up"></i>
    </button>

    <!-- WhatsApp Floating Button -->
    <a class="whatsapp-float" href="#" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp">
      <span class="whatsapp-btn">
        <i class="fab fa-whatsapp"></i>
      </span>
      <span class="whatsapp-tooltip">Chat with us</span>
    </a>

    <!-- Main JavaScript Module -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
