<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Victory Marketing Agency | Scale Sales & Grow Online</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/navigation.css" />
    <link rel="stylesheet" href="css/hero.css" />
    <link rel="stylesheet" href="css/sections.css" />
    <link rel="stylesheet" href="css/team.css" />
    <link rel="stylesheet" href="css/testimonials.css" />
    <link rel="stylesheet" href="css/contact.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>

    <!-- Loader (static, shows before JS loads) -->
    <div class="loader" id="loader">
      <div class="loader-content">
        <img src="assets/images/logo.png" alt="V" class="loader-logo" />
        <div class="loader-text">Victory Marketing</div>
      </div>
    </div>

    <!-- Navigation -->
    <nav id="navbar">
      <a href="#" class="nav-logo">
        <img src="assets/images/logo.png" alt="Victory Marketing Logo" />
        <span>Victory <span>Marketing</span></span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#team">Team</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a href="#contact" class="nav-cta">Get Started</a></li>
      </ul>
      <button class="mobile-menu-btn" id="mobileMenuBtn">
        <i class="fas fa-bars"></i>
      </button>
    </nav>

    <!-- Hero Section -->
    <section class="hero" id="home" data-section="hero"></section>

    <!-- About Section -->
    <section class="about" id="about" data-section="about"></section>

    <!-- Mission, Vision & Objective -->
    <section class="mission-section" id="mission" data-section="mission"></section>

    <!-- Services Section -->
    <section class="services" id="services" data-section="services"></section>

    <!-- Why Choose Us -->
    <section class="why-us" id="why-us" data-section="why-us"></section>

    <!-- Process Section -->
    <section class="process" id="process" data-section="process"></section>

    <!-- Testimonials -->
    <section class="testimonials" id="testimonials" data-section="testimonials"></section>

    <!-- Team Section -->
    <section class="team" id="team" data-section="team"></section>

    <!-- CTA Banner -->
    <section data-section="cta"></section>

    <!-- Contact Section -->
    <section class="contact" id="contact" data-section="contact"></section>

    <!-- Footer -->
    <footer data-section="footer"></footer>

    <!-- Scroll to Top -->
    <button class="scroll-top" id="scrollTop">
      <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Main JavaScript Module -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
